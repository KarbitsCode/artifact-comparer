name: 'Artifact Comparer'
description: 'Compare artifact file sizes between two builds'

inputs:
  artifact-name:
    description: 'Name of the base artifact to compare against'
    required: true
  path:
    description: 'Directory path of the new/head artifact already available in the workspace'
    required: true
  github-token:
    description: 'GitHub token used to download the base artifact from previous workflow runs'
    required: false
    default: ${{ github.token }}

outputs:
  comparison-result:
    description: 'JSON string containing the file size comparison result'
    value: ${{ steps.compare.outputs.comparison-result }}

runs:
  using: 'composite'
  steps:
    - name: Prepare base artifact directory
      id: base_artifact
      shell: pwsh
      run: |
        $baseDir = Join-Path $env:RUNNER_TEMP ("artifact-comparer-base-" + [guid]::NewGuid().ToString("N"))
        New-Item -ItemType Directory -Path $baseDir | Out-Null
        $normalizedBaseDir = ($baseDir -replace '\\', '/') -replace '[\r\n]+', ''
        Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('base-dir={0}' -f $normalizedBaseDir)

    - name: Download base artifact
      uses: dawidd6/action-download-artifact@v19
      with:
        github_token: ${{ inputs.github-token }}
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.base_artifact.outputs.base-dir }}
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Compare artifacts
      id: compare
      uses: actions/github-script@v8.0.0
      env:
        BASE_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        BASE_ARTIFACT_PATH: ${{ steps.base_artifact.outputs.base-dir }}
        HEAD_ARTIFACT_PATH: ${{ inputs.path }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          
          const SUMMARY_HEADER_LINES = [
            '## 📦 Artifact Size Report',
            '',
            '| File | Before (KB) | After (KB) | Delta |',
            '|------|-------------|------------|-------|',
          ];
          
          function roundToHundredths(value) {
            return Math.round(value * 100) / 100;
          }
          
          async function pathExists(pathToCheck) {
            try {
              await fs.promises.access(pathToCheck);
              return true;
            } catch {
              return false;
            }
          }
          
          async function collectArtifactStats(
            directoryPath,
            basePath = directoryPath,
            fileSizesKb = {}
          ) {
            if (!(await pathExists(directoryPath))) {
              return { totalSizeBytes: 0, fileSizesKb };
            }
          
            const entries = await fs.promises.readdir(directoryPath, { withFileTypes: true });
            let totalSizeBytes = 0;
          
            for (const entry of entries) {
              const fullPath = path.join(directoryPath, entry.name);
          
              if (entry.isDirectory()) {
                const nestedStats = await collectArtifactStats(fullPath, basePath, fileSizesKb);
                totalSizeBytes += nestedStats.totalSizeBytes;
                continue;
              }
          
              if (entry.isFile()) {
                const relativePath = path.relative(basePath, fullPath);
                const stats = await fs.promises.stat(fullPath);
                totalSizeBytes += stats.size;
                fileSizesKb[relativePath] = roundToHundredths(stats.size / 1024);
              }
            }
          
            return { totalSizeBytes, fileSizesKb };
          }
          
          function escapeMarkdownCell(value) {
            const normalized = String(value).replace(/\r?\n/g, ' ');
            const htmlEscaped = normalized
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
            return htmlEscaped
              .replace(/\\/g, '\\\\')
              .replace(/\|/g, '\\|')
              .replace(/[`*_\[\](){}]/g, (match) => `\\${match}`);
          }
          
          function formatDelta(before, after) {
            if (before !== undefined && after !== undefined) {
              const diff = roundToHundredths(after - before);
              if (diff === 0) {
                return '0 KB';
              }
          
              return diff > 0 ? `+${diff} KB` : `${diff} KB`;
            }
          
            if (before === undefined && after !== undefined) {
              return 'NEW';
            }
          
            if (before !== undefined && after === undefined) {
              return 'REMOVED';
            }
          
            return '';
          }
          
          const baseArtifactName = process.env.BASE_ARTIFACT_NAME;
          const baseArtifactPath = process.env.BASE_ARTIFACT_PATH;
          const headArtifactPath = process.env.HEAD_ARTIFACT_PATH;
          
          if (!baseArtifactName) {
            throw new Error('BASE_ARTIFACT_NAME must be set');
          }
          
          if (!baseArtifactPath || !headArtifactPath) {
            throw new Error('BASE_ARTIFACT_PATH and HEAD_ARTIFACT_PATH must be set');
          }
          
          if (!(await pathExists(headArtifactPath))) {
            throw new Error(`Head artifact path '${headArtifactPath}' not found`);
          }
          
          let headStat;
          try {
            headStat = await fs.promises.stat(headArtifactPath);
          } catch (error) {
            const errorMessage = error instanceof Error ? error.message : String(error);
            throw new Error(
              `Head artifact path '${headArtifactPath}' is not accessible: ${errorMessage}`
            );
          }
          
          if (!headStat.isDirectory()) {
            throw new Error(`Head artifact path '${headArtifactPath}' is not a directory`);
          }
          
          const baseStats = await collectArtifactStats(baseArtifactPath);
          const headStats = await collectArtifactStats(headArtifactPath);
          const baseSizeBytes = baseStats.totalSizeBytes;
          const headSizeBytes = headStats.totalSizeBytes;
          const baseFileSizesKb = baseStats.fileSizesKb;
          const headFileSizesKb = headStats.fileSizesKb;
          const diffBytes = headSizeBytes - baseSizeBytes;
          const diffPercent =
            baseSizeBytes === 0
              ? null
              : roundToHundredths((diffBytes / baseSizeBytes) * 100);
          
          const fileSet = new Set();
          for (const file of Object.keys(baseFileSizesKb)) {
            fileSet.add(file);
          }
          for (const file of Object.keys(headFileSizesKb)) {
            fileSet.add(file);
          }
          const allFiles = [...fileSet].sort();
          
          const markdownRows = [...SUMMARY_HEADER_LINES];
          for (const file of allFiles) {
            const before = baseFileSizesKb[file];
            const after = headFileSizesKb[file];
            const delta = formatDelta(before, after);
          
            markdownRows.push(
              `| ${escapeMarkdownCell(file)} | ${before ?? '-'} | ${after ?? '-'} | ${delta} |`
            );
          }
          
          const markdown = `${markdownRows.join('\n')}\n`;
          
          const result = {
            base: {
              name: baseArtifactName,
              sizeBytes: baseSizeBytes,
            },
            head: {
              name: path.basename(path.resolve(headArtifactPath)),
              sizeBytes: headSizeBytes,
            },
            diff: {
              bytes: diffBytes,
              percent: diffPercent,
            },
          };
          
          const resultJson = JSON.stringify(result);
          core.setOutput('comparison-result', resultJson);
          
          if (process.env.GITHUB_STEP_SUMMARY) {
            try {
              await fs.promises.appendFile(process.env.GITHUB_STEP_SUMMARY, markdown);
            } catch (error) {
              core.warning(`Failed to write step summary: ${error instanceof Error ? error.message : String(error)}`);
            }
          }
          
          core.info(`Comparison result: ${resultJson}`);

    - name: Cleanup base artifact directory
      if: ${{ always() && startsWith(steps.base_artifact.outputs.base-dir, format('{0}/artifact-comparer-base-', replace(runner.temp, '\\', '/'))) }}
      uses: JesseTG/rm@v1.0.3
      with:
        path: ${{ steps.base_artifact.outputs.base-dir }}
