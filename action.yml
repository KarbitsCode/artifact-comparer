name: 'Artifact Comparer'
description: 'Compare artifact file sizes between two builds'

inputs:
  base-artifact-name:
    description: 'Name of the base artifact to compare against'
    required: true
  head-artifact-name:
    description: 'Name of the head artifact to compare'
    required: true
  github-token:
    description: 'GitHub token used to download the base artifact from previous workflow runs'
    required: false
    default: ${{ github.token }}

outputs:
  comparison-result:
    description: 'JSON string containing the file size comparison result'
    value: ${{ steps.compare.outputs.comparison-result }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      run: npm ci --prefix ${{ github.action_path }}

    - name: Download base artifact
      uses: dawidd6/action-download-artifact@v19
      with:
        github_token: ${{ inputs.github-token }}
        name: ${{ inputs.base-artifact-name }}
        path: ${{ runner.temp }}/artifact-comparer/base
        search_artifacts: true
        if_no_artifact_found: ignore

    - name: Download head artifact
      uses: actions/download-artifact@v4.1.3
      with:
        name: ${{ inputs.head-artifact-name }}
        path: ${{ runner.temp }}/artifact-comparer/head

    - name: Compare artifacts
      id: compare
      shell: bash
      env:
        BASE_ARTIFACT_NAME: ${{ inputs.base-artifact-name }}
        HEAD_ARTIFACT_NAME: ${{ inputs.head-artifact-name }}
        BASE_ARTIFACT_PATH: ${{ runner.temp }}/artifact-comparer/base
        HEAD_ARTIFACT_PATH: ${{ runner.temp }}/artifact-comparer/head
      run: node ${{ github.action_path }}/main.js
