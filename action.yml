name: 'Artifact Comparer'
description: 'Compare artifact file sizes between two builds'

inputs:
  base-artifact-name:
    description: 'Name of the base artifact to compare against'
    required: true
  head-artifact-dir:
    description: 'Directory path of the new/head artifact already available in the workspace'
    required: true
  github-token:
    description: 'GitHub token used to download the base artifact from previous workflow runs'
    required: false
    default: ${{ github.token }}

outputs:
  comparison-result:
    description: 'JSON string containing the file size comparison result'
    value: ${{ steps.compare.outputs.comparison-result }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      run: npm ci --prefix ${{ github.action_path }}

    - name: Prepare base artifact directory
      id: base_artifact
      shell: bash
      run: |
        BASE_DIR="$(mktemp -d "${RUNNER_TEMP}/artifact-comparer-base-XXXXXX")"
        echo "base-dir=$BASE_DIR" >> "$GITHUB_OUTPUT"

    - name: Download base artifact
      uses: dawidd6/action-download-artifact@v19
      with:
        github_token: ${{ inputs.github-token }}
        name: ${{ inputs.base-artifact-name }}
        path: ${{ steps.base_artifact.outputs.base-dir }}
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Compare artifacts
      id: compare
      shell: bash
      env:
        BASE_ARTIFACT_NAME: ${{ inputs.base-artifact-name }}
        BASE_ARTIFACT_PATH: ${{ steps.base_artifact.outputs.base-dir }}
        HEAD_ARTIFACT_PATH: ${{ inputs.head-artifact-dir }}
      run: node ${{ github.action_path }}/main.js

    - name: Cleanup base artifact directory
      if: always()
      shell: bash
      env:
        BASE_ARTIFACT_PATH: ${{ steps.base_artifact.outputs.base-dir }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        if [[ "$BASE_ARTIFACT_PATH" == "$RUNNER_TEMP_DIR/artifact-comparer-base-"* ]]; then
          if rm -rf "$BASE_ARTIFACT_PATH"; then
            echo "Cleaned up base artifact directory: $BASE_ARTIFACT_PATH"
          else
            rm_exit=$?
            echo "Failed to clean up base artifact directory: $BASE_ARTIFACT_PATH (rm exit code: $rm_exit)"
          fi
        else
          echo "Skipping cleanup - path does not match expected pattern '$RUNNER_TEMP_DIR/artifact-comparer-base-*': $BASE_ARTIFACT_PATH"
        fi
