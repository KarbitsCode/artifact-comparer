name: artifact-comparer test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Create base artifact
        shell: bash
        run: |
          mkdir -p base-output
          head -c 20000 /dev/urandom > base-output/app.txt

      - name: Upload base artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: artifact-test-base
          path: base-output

      - name: Create head artifact
        shell: bash
        run: |
          mkdir -p head-output
          head -c 30000 /dev/urandom > head-output/app.txt
          head -c 5000 /dev/urandom > head-output/new.txt

      - name: Run local action
        id: compare
        uses: ./
        with:
          artifact-name: artifact-test-base
          path: ./head-output
          github-token: ${{ github.token }}

      - name: Verify comparison result
        uses: actions/github-script@v9.0.0
        env:
          RESULT: ${{ steps.compare.outputs.comparison-result }}
        with:
          script: |
            const result = JSON.parse(process.env.RESULT);
            if (result.base.sizeBytes === 0) {
              core.warning('No prior successful run has a baseline artifact yet - this run will become that baseline.');
              return;
            }
            if (result.head.sizeBytes <= result.base.sizeBytes) {
              core.setFailed('Head artifact did not grow');
              return;
            }
            if (result.diff.bytes <= 0) {
              core.setFailed('Expected a positive size difference');
            }
